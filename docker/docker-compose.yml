services:
  # Ollama service with Phi-3 model
  ollama:
    image: ollama/ollama:latest
    container_name: miragepot-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
      - ./entrypoint-ollama.sh:/entrypoint-ollama.sh:ro
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3}
    entrypoint: ["/bin/bash", "/entrypoint-ollama.sh"]
    networks:
      - miragepot-net
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4.0"
        reservations:
          memory: 2g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s

  # MiragePot SSH Honeypot
  miragepot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: miragepot-honeypot
    restart: unless-stopped
    ports:
      - "2222:2222"   # SSH honeypot (change to 22:2222 for standard SSH port)
      - "127.0.0.1:8501:8501"   # Streamlit dashboard
      - "127.0.0.1:9090:9090"   # Metrics endpoint
    volumes:
      - ../data/logs:/app/data/logs
      - ../data/cache.json:/app/data/cache.json
      - ../data/system_prompt.txt:/app/data/system_prompt.txt:ro
    env_file:
      - ../.env.docker
    environment:
      - MIRAGEPOT_SSH_HOST=0.0.0.0
      - MIRAGEPOT_SSH_PORT=2222
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - miragepot-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 2222)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: miragepot-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"   # Prometheus UI
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - miragepot-net
    depends_on:
      - miragepot
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Alertmanager for notifications
  alertmanager:
    image: prom/alertmanager:latest
    container_name: miragepot-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"   # Alertmanager UI
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - miragepot-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: miragepot-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env.docker}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      # Angular plugins removed — worldmap-panel and piechart-panel are deprecated
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    networks:
      - miragepot-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  miragepot-net:
    driver: bridge

volumes:
  ollama-data:
    driver: local
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local

